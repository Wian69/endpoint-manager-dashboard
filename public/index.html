<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endpoint Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <h1>Endpoint Management <span>Dashboard</span></h1>
            <p>Real-time device monitoring and update deployment</p>
        </header>

        <main>
            <div class="glass-card" style="margin-bottom: 2rem;">
                <h3 style="margin-bottom: 1rem; color: var(--text-secondary);">Global Settings</h3>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label for="restart-msg" style="font-size: 0.9rem; font-weight: 600;">Restart Notification Message</label>
                    <textarea id="restart-msg" rows="2" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--bg-dark); color: var(--text-primary); font-family: 'Inter', sans-serif;" onchange="saveSettings()">Equinox Outsourced services has deployed a restart as the device has pending updates. The device will restart in 5 minutes to save your work.</textarea>
                </div>
            </div>
            <div class="stats-row">
                <div class="stat-card glass-card">
                    <h3>Total Devices</h3>
                    <div class="stat-value" id="total-devices">0</div>
                </div>
                <div class="stat-card glass-card warning">
                    <h3>Pending Updates</h3>
                    <div class="stat-value" id="total-updates">0</div>
                </div>
            </div>

            <section class="devices-section">
                <div class="section-header">
                    <h2>Connected Endpoints</h2>
                    <button class="btn-primary" onclick="refreshDevices()">Refresh Data</button>
                </div>
                
                <div class="devices-grid" id="devices-grid">
                    <!-- Devices will be injected here via JS -->
                    <div class="loading-spinner">Loading devices...</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Device Details Modal -->
    <div id="deviceModal" class="modal" style="display: none;">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h2 id="modalDeviceName">Device Name</h2>
                <button class="close-btn" onclick="closeDeviceModal()">×</button>
            </div>
            <div class="modal-body" id="modalDeviceBody">
                <!-- Detailed content injected here -->
            </div>
            <div class="modal-actions" id="modalDeviceActions">
                <!-- Action buttons injected here -->
            </div>
        </div>
    </div>

    <!-- Log Modal -->
    <div id="logs-modal" class="modal">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h2 id="modal-title">Device Logs</h2>
                <span class="close-btn" onclick="closeLogs()">&times;</span>
            </div>
            <div class="terminal-window" id="terminal-output">
                <!-- Logs injected here -->
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="modal-progress" style="width: 0%"></div>
            </div>
            <div class="modal-footer">
                <span id="modal-status" class="tag">Status</span>
                <button class="btn-primary" onclick="refreshCurrentLogs()">Refresh Logs</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
